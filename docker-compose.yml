version: '3.4'

services:
  raceday_api:
    image: raceday_api
    build:
      context: .
      dockerfile: RaceDay_API/Dockerfile
    ports:
      - "7092:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=tcp:racedayserver-siyabonga.database.windows.net,1433;Initial Catalog=RaceDayDB;Persist Security Info=False;User ID=racedayadmin;Password=YOUR_SQL_PASSWORD_HERE;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
      - ConnectionStrings__AzureBlobStorage=DefaultEndpointsProtocol=https;AccountName=racedaystoragesiyabonga;AccountKey=YOUR_STORAGE_KEY_HERE==;EndpointSuffix=core.windows.net

  raceday_web:
    image: raceday_web
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    ports:
      - "7239:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://raceday_api:8080/
    depends_on:
      - raceday_api